<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星伴 Club · 实时拍卖</title><style>body{margin:0;background:#0b1025;color:#eeeaff;font:15px system-ui}header{padding:20px;background:#171e3a;font-size:23px;font-weight:800;color:#c9baff}main{max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#161e38;border:1px solid #343b5a;border-radius:14px;padding:18px;margin-bottom:16px}input,textarea{background:#0d152b;color:white;border:1px solid #515b7e;padding:11px;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#7959e9;color:white;border:0;padding:11px 15px;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row input{flex:1;min-width:90px}.muted{color:#b1bad4}.lot{border-top:1px solid #38415c;padding:16px 0}.price{font-size:28px;color:#d5beff;font-weight:800}.lot img{max-width:100%;max-height:270px;border-radius:12px}.small{font-size:12px}.hidden{display:none}#message{position:sticky;top:0;background:#3b2f7e;padding:10px;display:none}@media(max-width:720px){main{grid-template-columns:1fr}}</style></head><body><header>✦ 星伴 STAR AUCTION <span class="small muted">多人实时竞拍</span></header><div id="message"></div><main><section><div class="card"><h3>参与竞拍</h3><div class="row"><input id="name" placeholder="老板昵称，至少2字"><button id="join">进入竞拍</button></div><p id="identity" class="muted">输入昵称参与，每个浏览器保存独立竞拍身份。</p></div><div class="card"><h3>拍卖大厅</h3><div id="lots">等待连接服务器…</div></div></section><aside><div class="card"><button id="toggle">⚙ 管理员入口</button><div id="admin" class="hidden"><h3>管理员登录</h3><div class="row"><input id="pwd" type="password" placeholder="管理员密码"><button id="login">登录</button></div><div id="tools" class="hidden"><h3>📦 提前上传拍品库</h3><p class="muted small">可提前保存多件拍品，只有手动开始才进入10秒开拍倒计时。</p><div class="row"><input id="title" placeholder="拍品名称"></div><textarea id="desc" placeholder="拍品说明" style="width:100%"></textarea><p class="muted small">拍品图片（不超过2MB）</p><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><p class="small muted">起拍价 / 最低加价（元）</p><div class="row"><input id="start" type="number" value="50"><input id="step" type="number" value="10"></div><p class="small muted">封顶价（元，可留空表示无上限）</p><div class="row"><input id="cap" type="number" min="0" step="1" placeholder="例如 500"></div><p class="small muted">竞拍时长（秒）/ 最后时刻自动延时（秒）</p><div class="row"><input id="duration" type="number" value="180"><input id="extend" type="number" value="15"></div><button id="create">保存待拍品</button><p class="muted small">连续保存多个拍品，届时从待拍品库中选择单件开拍。<h3>📋 待拍品管理</h3><div id="draftlist">暂无待拍品</div></p></div></div></div><div class="card"><h3>使用须知</h3><p class="muted">当前为免费测试版，不含支付和实名验证。免费服务器休眠或重启可能丢失图片与数据，请勿直接用于真实交易。</p></div></aside></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
